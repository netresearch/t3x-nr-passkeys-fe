services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Netresearch\NrPasskeysFe\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'

  Netresearch\NrPasskeysFe\Configuration\FrontendConfiguration:
    public: true
    factory: ['Netresearch\NrPasskeysFe\Configuration\FrontendConfiguration', 'fromExtensionConfiguration']

  # Event listener for felogin passkey injection.
  # Registered via tag (not attribute) because felogin is optional —
  # the ::class constant can't be used in #[AsEventListener] when the
  # event class may not exist in the autoloader during DI compilation.
  Netresearch\NrPasskeysFe\EventListener\InjectPasskeyLoginFields:
    tags:
      - name: event.listener
        identifier: 'nr-passkeys-fe/inject-passkey-login-fields'
        event: TYPO3\CMS\FrontendLogin\Event\ModifyLoginFormViewEvent

  # Public services (needed for controllers, GeneralUtility::makeInstance, etc.)
  Netresearch\NrPasskeysFe\Service\FrontendWebAuthnService:
    public: true

  Netresearch\NrPasskeysFe\Service\SiteConfigurationService:
    public: true

  Netresearch\NrPasskeysFe\Service\FrontendCredentialRepository:
    public: true

  Netresearch\NrPasskeysFe\Service\FrontendUserLookupService:
    public: true

  Netresearch\NrPasskeysFe\Service\FrontendEnforcementService:
    public: true

  Netresearch\NrPasskeysFe\Service\LinkablePageResolver:
    public: true

  Netresearch\NrPasskeysFe\Service\FrontendGroupEnforcementService:
    public: true

  Netresearch\NrPasskeysFe\Service\RecoveryCodeService:
    public: true

  Netresearch\NrPasskeysFe\Service\PasskeyEnrollmentService:
    public: true

  Netresearch\NrPasskeysFe\Service\FrontendAdoptionStatsService:
    public: true

  # Contributes the frontend (fe_users) segment to the unified passkey-adoption
  # dashboard widgets owned by nr_passkeys_be. Tagged explicitly rather than
  # relying solely on cross-extension autoconfiguration of the BE interface.
  Netresearch\NrPasskeysFe\Adoption\FrontendPasskeyAdoptionStatsProvider:
    tags:
      - name: nr_passkeys_be.adoption_stats_provider

  Netresearch\NrPasskeysFe\Controller\LoginController:
    public: true
    arguments:
      $rateLimiterService: '@nr_passkeys_fe.limiter'

  Netresearch\NrPasskeysFe\Controller\ManagementController:
    public: true

  Netresearch\NrPasskeysFe\Controller\RecoveryController:
    public: true
    arguments:
      $rateLimiterService: '@nr_passkeys_fe.limiter'

  Netresearch\NrPasskeysFe\Controller\EnrollmentController:
    public: true

  Netresearch\NrPasskeysFe\Controller\AdminController:
    public: true
    arguments:
      $rateLimiterService: '@nr_passkeys_fe.limiter'

  Netresearch\NrPasskeysFe\Controller\AdminModuleController:
    public: true

  Netresearch\NrPasskeysFe\Controller\EidDispatcher:
    public: true

  Netresearch\NrPasskeysFe\Form\Element\PasskeyFeInfoElement:
    public: true

  Netresearch\NrPasskeysFe\Service\ConsumedTokenStore:
    public: true

  Netresearch\NrPasskeysFe\Service\FrontendLoginAssurance:
    public: true

  cache.nr_passkeys_fe_ratelimit:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['nr_passkeys_fe_ratelimit']

  nr_passkeys_fe.limiter:
    class: Netresearch\NrPasskeysBe\Service\RateLimiterService
    public: true
    arguments:
      $rateLimitCache: '@cache.nr_passkeys_fe_ratelimit'

  Netresearch\NrPasskeysFe\Service\FrontendRateLimiter:
    public: true
    arguments:
      $service: '@nr_passkeys_fe.limiter'

  Netresearch\NrPasskeysFe\EventListener\SendEnrollmentNotification:
    arguments:
      $mailer: !service_closure '@TYPO3\CMS\Core\Mail\MailerInterface'
    tags:
      - name: event.listener
        identifier: 'nr-passkeys-fe/enrollment-email'
        event: Netresearch\NrPasskeysFe\Event\AfterPasskeyEnrollmentEvent
