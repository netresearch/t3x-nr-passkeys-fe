<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<!--

  Help tab for the FE Passkey Management admin module.
  Provides rollout guidance, recovery procedures, and FAQ for frontend
  user passkeys.
-->
<f:layout name="Module" />
<f:section name="Content">
    <h1><f:translate key="help.title" extensionName="NrPasskeysFe" /></h1>
    <p class="lead">
        <f:translate key="help.description" extensionName="NrPasskeysFe" />
    </p>

    <!-- ================================================================== -->
    <!-- Section 1: Rolling out passkeys                                     -->
    <!-- ================================================================== -->
    <div class="card mb-3">
        <div class="card-header">
            <h2 class="card-title mb-0"><f:translate key="help.rollout.title" extensionName="NrPasskeysFe" /></h2>
        </div>
        <div class="card-body">
            <p>
                <f:translate key="help.rollout.description" extensionName="NrPasskeysFe" />
            </p>

            <h3><f:translate key="help.rollout.step.1.title" extensionName="NrPasskeysFe" /></h3>
            <p>
                <f:translate key="help.rollout.step.1.description" extensionName="NrPasskeysFe" />
            </p>

            <h3><f:translate key="help.rollout.step.2.title" extensionName="NrPasskeysFe" /></h3>
            <p>
                <f:translate key="help.rollout.step.2.description" extensionName="NrPasskeysFe" />
            </p>

            <h3><f:translate key="help.rollout.step.3.title" extensionName="NrPasskeysFe" /></h3>
            <p>
                <f:translate key="help.rollout.step.3.description" extensionName="NrPasskeysFe" />
            </p>
            <f:be.infobox title="{f:translate(key: 'help.rollout.step.3.tip.title', extensionName: 'NrPasskeysFe')}" state="{f:constant(name: 'TYPO3\CMS\Fluid\ViewHelpers\Be\InfoboxViewHelper::STATE_INFO')}">
                <f:translate key="help.rollout.step.3.tip" extensionName="NrPasskeysFe" />
            </f:be.infobox>

            <h3><f:translate key="help.rollout.step.4.title" extensionName="NrPasskeysFe" /></h3>
            <p>
                <f:translate key="help.rollout.step.4.description" extensionName="NrPasskeysFe" />
            </p>

            <h3><f:translate key="help.rollout.step.5.title" extensionName="NrPasskeysFe" /></h3>
            <p>
                <f:translate key="help.rollout.step.5.description" extensionName="NrPasskeysFe" />
            </p>

            <h3><f:translate key="help.rollout.step.6.title" extensionName="NrPasskeysFe" /></h3>
            <p>
                <f:translate key="help.rollout.step.6.description" extensionName="NrPasskeysFe" />
            </p>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- Section 2: Recovery procedures                                      -->
    <!-- ================================================================== -->
    <div class="card mb-3">
        <div class="card-header">
            <h2 class="card-title mb-0"><f:translate key="help.recovery.title" extensionName="NrPasskeysFe" /></h2>
        </div>
        <div class="card-body">
            <p>
                <f:translate key="help.recovery.description" extensionName="NrPasskeysFe" />
            </p>

            <h3><f:translate key="help.recovery.step.1.title" extensionName="NrPasskeysFe" /></h3>
            <p>
                <f:translate key="help.recovery.step.1.description" extensionName="NrPasskeysFe" />
            </p>

            <h3><f:translate key="help.recovery.step.2.title" extensionName="NrPasskeysFe" /></h3>
            <p>
                <f:translate key="help.recovery.step.2.description.1" extensionName="NrPasskeysFe" />
            </p>
            <p>
                <f:translate key="help.recovery.step.2.description.2" extensionName="NrPasskeysFe" />
            </p>

            <h3><f:translate key="help.recovery.step.3.title" extensionName="NrPasskeysFe" /></h3>
            <p>
                <f:translate key="help.recovery.step.3.description" extensionName="NrPasskeysFe" />
            </p>

            <h3><f:translate key="help.recovery.step.4.title" extensionName="NrPasskeysFe" /></h3>
            <p>
                <f:translate key="help.recovery.step.4.description.1" extensionName="NrPasskeysFe" />
            </p>
            <p>
                <f:translate key="help.recovery.step.4.description.2" extensionName="NrPasskeysFe" />
            </p>
            <f:be.infobox title="{f:translate(key: 'help.recovery.warning.title', extensionName: 'NrPasskeysFe')}" state="{f:constant(name: 'TYPO3\CMS\Fluid\ViewHelpers\Be\InfoboxViewHelper::STATE_WARNING')}">
                <f:translate key="help.recovery.warning.description" extensionName="NrPasskeysFe" />
            </f:be.infobox>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- Section 3: Enforcement levels                                       -->
    <!-- ================================================================== -->
    <div class="card mb-3">
        <div class="card-header">
            <h2 class="card-title mb-0"><f:translate key="help.enforcement.title" extensionName="NrPasskeysFe" /></h2>
        </div>
        <div class="card-body">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th scope="col"><f:translate key="help.enforcement.column.level" extensionName="NrPasskeysFe" /></th>
                        <th scope="col"><f:translate key="help.enforcement.column.behaviour" extensionName="NrPasskeysFe" /></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong><f:translate key="enforcement.level.off" extensionName="NrPasskeysFe" /></strong></td>
                        <td><f:translate key="help.enforcement.level.off" extensionName="NrPasskeysFe" /></td>
                    </tr>
                    <tr>
                        <td><strong><f:translate key="enforcement.level.encourage" extensionName="NrPasskeysFe" /></strong></td>
                        <td>
                            <f:translate key="help.enforcement.level.encourage" extensionName="NrPasskeysFe" />
                        </td>
                    </tr>
                    <tr>
                        <td><strong><f:translate key="enforcement.level.required" extensionName="NrPasskeysFe" /></strong></td>
                        <td>
                            <f:translate key="help.enforcement.level.required" extensionName="NrPasskeysFe" />
                        </td>
                    </tr>
                    <tr>
                        <td><strong><f:translate key="enforcement.level.enforced" extensionName="NrPasskeysFe" /></strong></td>
                        <td>
                            <f:translate key="help.enforcement.level.enforced" extensionName="NrPasskeysFe" />
                        </td>
                    </tr>
                </tbody>
            </table>
            <f:be.infobox title="{f:translate(key: 'help.enforcement.strictest_wins.title', extensionName: 'NrPasskeysFe')}" state="{f:constant(name: 'TYPO3\CMS\Fluid\ViewHelpers\Be\InfoboxViewHelper::STATE_NOTICE')}">
                <f:translate key="help.enforcement.strictest_wins.description" extensionName="NrPasskeysFe" />
            </f:be.infobox>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- Section 4: FAQ                                                      -->
    <!-- ================================================================== -->
    <div class="card mb-3">
        <div class="card-header">
            <h2 class="card-title mb-0"><f:translate key="help.faq.title" extensionName="NrPasskeysFe" /></h2>
        </div>
        <div class="card-body">
            <!-- Native disclosure widgets: Bootstrap's accordion is not part of the
                 TYPO3 backend CSS (13.4 or 14.3), so its buttons rendered as
                 unstyled browser buttons. <details> needs no script. -->
            <details class="passkey-fe-faq mb-2" name="passkey-fe-faq">
                <summary><f:translate key="help.faq.question.1" extensionName="NrPasskeysFe" /></summary>
                <p>
                    <f:translate key="help.faq.answer.1" extensionName="NrPasskeysFe" />
                </p>
            </details>
            <details class="passkey-fe-faq mb-2" name="passkey-fe-faq">
                <summary><f:translate key="help.faq.question.2" extensionName="NrPasskeysFe" /></summary>
                <p>
                    <f:translate key="help.faq.answer.2" extensionName="NrPasskeysFe" />
                </p>
            </details>
            <details class="passkey-fe-faq mb-2" name="passkey-fe-faq">
                <summary><f:translate key="help.faq.question.3" extensionName="NrPasskeysFe" /></summary>
                <p>
                    <f:translate key="help.faq.answer.3" extensionName="NrPasskeysFe" />
                </p>
            </details>
            <details class="passkey-fe-faq mb-2" name="passkey-fe-faq">
                <summary><f:translate key="help.faq.question.4" extensionName="NrPasskeysFe" /></summary>
                <p>
                    <f:translate key="help.faq.answer.4" extensionName="NrPasskeysFe" />
                </p>
            </details>
            <details class="passkey-fe-faq mb-2" name="passkey-fe-faq">
                <summary><f:translate key="help.faq.question.5" extensionName="NrPasskeysFe" /></summary>
                <p>
                    <f:translate key="help.faq.answer.5" extensionName="NrPasskeysFe" />
                </p>
            </details>
        </div>
    </div>

</f:section>
</html>
