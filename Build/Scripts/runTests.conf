# Per-extension settings for the shared test runner. See runTests.conf.dist in
# netresearch/typo3-ci-workflows for everything that can go here.

# The functional config is Build/phpunit.functional.xml. Detection looks there
# as of netresearch/typo3-ci-workflows#208, but that is not in a release yet;
# until it is, the pin is what keeps the functional run off Build/phpunit.xml,
# which carries only the unit and fuzz suites. Harmless to keep afterwards.
PHPUNIT_FUNCTIONAL_CONFIG="Build/phpunit.functional.xml"

# `-s e2e` builds its own TYPO3: MariaDB, a composer-installed instance with
# this extension from a path repository, PHP-FPM and Apache.
#
# The instance is TYPO3 13 unless E2E_TYPO3_VERSION=14 says otherwise. Prefer
# that variable over `-t 14`: `-t` is not suite-gated, so it rewrites this
# extension's composer.json and runs a `composer require` before provisioning
# even starts.
E2E_PROVISION=1

# A frontend suite needs frontend content, and content elements only render
# when something renders them. The Core ships that in fluid_styled_content,
# which is not a dependency of this extension — an integrator brings their own
# rendering definition — so the e2e instance installs it explicitly. felogin
# comes along because the login plugin extends its template.
e2e_provision_packages() {
    printf '%s' 'typo3/cms-fluid-styled-content typo3/cms-felogin'
}

# The same package as a site set, which is how v13 and v14 pull its TypoScript
# into the site. Without this the content object below renders nothing.
e2e_provision_site_dependencies() {
    printf '%s\n' '  - typo3/fluid-styled-content'
}

# The page object. `styles.content.get` comes from fluid_styled_content and
# renders the content elements the seed places on each page; the plugins are
# content elements, so nothing of this extension is visible without it.
#
# The extension's own TypoScript is not registered as a static file, so it is
# imported here — it carries the template paths the plugin views resolve from.
e2e_provision_typoscript() {
    cat > "${E2E_SCRIPTS}/ts-setup.typoscript" << 'TYPOSCRIPT'
@import 'EXT:nr_passkeys_fe/Configuration/TypoScript/setup.typoscript'

page = PAGE
page.10 < styles.content.get
TYPOSCRIPT

    cat > "${E2E_SCRIPTS}/ts-constants.typoscript" << 'TYPOSCRIPT'
@import 'EXT:nr_passkeys_fe/Configuration/TypoScript/constants.typoscript'
TYPOSCRIPT
}

# Everything the suite needs that TYPO3's own setup does not create: the pages
# the specs open, the plugin content elements on them, a storage folder, an
# fe_user to log in as, and the site settings the WebAuthn ceremonies are
# validated against.
#
# rpId and origin have to name the host the browser uses. The extension reads
# them from site settings and otherwise derives them from the site base, which
# provisioning writes as '/' — parse_url() finds no host in that, so the
# ceremonies would be built against an empty relying party. The host is
# typo3.localhost rather than the Apache container's name because WebAuthn
# needs a secure context and Chromium grants that to .localhost but not to a
# container name over plain http; Tests/E2E/playwright.config.ts points the
# browser at the same name.
#
# Both settings files are written on purpose: v13 reads `settings:` out of
# config.yaml, v14 prefers settings.yaml, and the suite runs on both.
e2e_provision_seed() {
    local host="typo3.localhost"

    cat > "${E2E_ROOT}/config/system/additional.php" << PHP
<?php

declare(strict_types=1);

// nr_passkeys_be refuses to derive rpId and origin from the Host header while
// trustedHostsPattern is '.*' (ExtensionConfigurationService, exception
// 1700000060) — a real guard against Host-header spoofing, and '.*' is exactly
// what provisioning writes. Without these two settings every BACKEND request
// ends in a 503, including /typo3/login, because the backend extension boots
// there. The frontend settings live in the site's settings files; these are
// the backend extension's own.
\$GLOBALS['TYPO3_CONF_VARS']['EXTENSIONS']['nr_passkeys_be']['rpId'] = '${host}';
\$GLOBALS['TYPO3_CONF_VARS']['EXTENSIONS']['nr_passkeys_be']['origin'] = 'http://${host}';

// The rate limiter counts per IP and endpoint. Every spec arrives from the
// same address, and the production default of ten attempts per window is less
// than one suite run, so late specs would be refused for what early ones spent
// and the verdict would follow the execution order.
\$GLOBALS['TYPO3_CONF_VARS']['EXTENSIONS']['nr_passkeys_be']['rateLimitMaxAttempts'] = '500';
PHP

    cat >> "${E2E_ROOT}/config/sites/main/config.yaml" << YAML
settings:
  nr_passkeys_fe:
    rpId: '${host}'
    origin: 'http://${host}'
YAML

    cat > "${E2E_ROOT}/config/sites/main/settings.yaml" << YAML
nr_passkeys_fe:
  rpId: '${host}'
  origin: 'http://${host}'
YAML

    cat > "${E2E_SCRIPTS}/fe-seed.php" << 'SEED_EOF'
<?php

declare(strict_types=1);

// Pages, plugin content elements and one frontend user. This runs in a PHP
// container on the provisioning network, the same way db-setup.php does,
// because the database is not reachable from the host.
$pdo = new PDO(
    'mysql:host=mariadb-e2e;port=3306;dbname=e2e_test',
    'root',
    'root',
    [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION],
);
$now = time();

$page = static function (int $uid, int $pid, string $title, string $slug, int $doktype) use ($pdo, $now): void {
    $pdo->prepare(
        'INSERT INTO pages (uid, pid, title, slug, doktype, is_siteroot, hidden, deleted, tstamp, crdate)'
        . ' VALUES (?, ?, ?, ?, ?, 0, 0, 0, ?, ?)'
        . ' ON DUPLICATE KEY UPDATE title = VALUES(title), slug = VALUES(slug), doktype = VALUES(doktype), hidden = 0, deleted = 0',
    )->execute([$uid, $pid, $title, $slug, $doktype, $now, $now]);
};

// doktype 254 is a storage folder: fe_users live in one, and the plugins are
// pointed at it through the content element's storage pid.
$page(10, 1, 'Login', '/login', 1);
// The standalone login plugin gets a page of its own. On /login it would sit
// beside felogin's passkey tab, which renders the same element ids, and a
// locator would then match twice.
$page(13, 1, 'Login plugin', '/login-plugin', 1);
$page(11, 1, 'Member area', '/member', 1);
$page(12, 1, 'Enrollment', '/enrollment', 1);
$page(90, 1, 'Frontend users', '/fe-users', 254);
echo "pages seeded\n";

$plugin = static function (int $uid, int $pid, string $cType, string $header) use ($pdo, $now): void {
    $pdo->prepare(
        'INSERT INTO tt_content (uid, pid, CType, header, colPos, sorting, hidden, deleted, tstamp, crdate, pages)'
        . " VALUES (?, ?, ?, ?, 0, 256, 0, 0, ?, ?, '90')"
        . ' ON DUPLICATE KEY UPDATE CType = VALUES(CType), header = VALUES(header), pages = VALUES(pages), hidden = 0, deleted = 0',
    )->execute([$uid, $pid, $cType, $header, $now, $now]);
};

// felogin provides the password form the specs sign in with; the passkey
// plugin sits next to it on the same page, which is also how an integrator
// would place them.
$plugin(9, 10, 'felogin_login', 'Login');
$plugin(13, 13, 'nrpasskeysfe_passkeylogin', 'Passkey login');
$plugin(11, 11, 'nrpasskeysfe_passkeymanagement', 'Passkey management');
$plugin(12, 12, 'nrpasskeysfe_passkeyenrollment', 'Passkey enrollment');
echo "plugin content elements seeded\n";

// The password is what Tests/E2E/fixtures.ts logs in with. It is hashed here
// rather than pasted as a digest so the two cannot drift apart.
$password = password_hash('Passkey!E2E!2026', PASSWORD_ARGON2I);
$pdo->prepare(
    'INSERT INTO fe_users (uid, pid, username, password, email, name, disable, deleted, tstamp, crdate)'
    . ' VALUES (1, 90, ?, ?, ?, ?, 0, 0, ?, ?)'
    . ' ON DUPLICATE KEY UPDATE password = VALUES(password), disable = 0, deleted = 0',
)->execute(['e2e_user', $password, 'e2e@example.com', 'E2E User', $now, $now]);
echo "fe_user seeded\n";
SEED_EOF

    ${CONTAINER_BIN} run --rm ${CONTAINER_COMMON_PARAMS} --name e2e-feseed-${SUFFIX} \
        -v "${E2E_ROOT}:/var/www/html" \
        -v "${E2E_SCRIPTS}:/e2e-scripts" \
        -w /var/www/html \
        ${IMAGE_PHP} php /e2e-scripts/fe-seed.php
}

# The browser reaches typo3.localhost through Chromium's --host-resolver-rules
# (see Tests/E2E/playwright.config.ts), but the suite also calls page.request.*,
# and that APIRequestContext resolves through Node, which knows nothing about
# Chromium's rules: `getaddrinfo ENOTFOUND typo3.localhost`, and every API spec
# fails while the browser-driven ones pass. A hosts entry in the Playwright
# container covers the Node side.
#
# The address is per run, so it is read from the container provisioning just
# started. Nothing is printed when that container does not exist, and that is
# what keeps a foreign target safe: E2E_SECURE_ALIAS_HOST is the switch
# playwright.config.ts reads before it rewrites anything, so a run pointed at
# an instance of its own with TYPO3_BASE_URL keeps its host header instead of
# being sent to a name its vhost never heard of.
e2e_container_args() {
    local ip
    ip=$(${CONTAINER_BIN} inspect "apache-e2e-${SUFFIX}" \
        --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null) || return 0
    [ -n "${ip}" ] || return 0
    printf '%s' "--add-host typo3.localhost:${ip} -e E2E_SECURE_ALIAS_HOST=typo3.localhost"
}

# JavaScript unit tests — the shared runner has no js suite, so this adds one.
# package.json carries the same call as `npm run test:js`.
suite_js() {
    npm run test:js "$@"
}
